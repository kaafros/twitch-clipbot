# Only list streamers who have given you permission to repost their clips.
# priority: higher = posted first. hashtags: added to title + description.
# campaign: Content Rewards link - you get a GitHub notification to submit each new Short.
streamers:
  - name: clix
    paused: true          # paused for now - focusing on Jynxzi + Speed
    priority: 10
    hashtags: ["#Clix"]
    campaign: https://contentrewards.com/c/campaigns/17ff5e37-a774-4a75-a1a4-d47dba98a60e
  - name: jynxzi
    priority: 5
    layout: facecam       # his face-cam on top (found automatically), gameplay below
    lookback_hours: 720   # best clips of the last 30 days
    min_duration: 15
  - name: kaicenat
    paused: true
    layout: gameplay      # split screen: clip on top, runner game below
  - name: lacyoffline_
    paused: true
    layout: gameplay

min_views: 50            # skip clips with fewer views
lookback_hours: 48       # only clips created in the last N hours
max_uploads_per_run: 2   # total per run incl. batch clips (YouTube allows ~6/day)   # YouTube API quota allows ~6 uploads/day total
privacy: public
subtitles: true         # burn auto-generated captions into every video
tiktok: true            # also post every Short to TikTok via Buffer (needs BUFFER_API_KEY secret)

# Video layout: zoom (big video, title banner on top) | fill (full-screen crop) |
#               blur (whole video, small) | split (face-cam on top, needs facecam below)
layout: zoom
zoom: 1.0               # >1.0 zooms in (bigger video, but cuts the sides - can hide the face-cam)
# For split layout, add the face-cam box per streamer as fractions [x, y, width, height], e.g.
#   - name: somestreamer
#     facecam: [0.0, 0.25, 0.22, 0.28]          # public | unlisted | private
tags: [twitch, gaming, shorts, clips]

# Pre-made campaign clips. Posted before Twitch clips, batch_per_run at a time.
