name: subs-test
permissions:
  contents: write
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-small-en}
      - run: pip install -r requirements.txt
      - run: |
          python -c "import clipbot; print(clipbot.burn_subtitles('batches/speed/speed-expedia-1.mp4', '/tmp/out.mp4', 570))"
          head -30 /tmp/out.ass
          mkdir -p docs/test && for t in 8 20 35; do ffmpeg -y -loglevel error -ss $t -i /tmp/out.mp4 -frames:v 1 -vf scale=360:-1 docs/test/sub_$t.jpg; done
          git config user.name clipbot; git config user.email clipbot@users.noreply.github.com
          git add docs/test && git commit -m "subtitle test frames" && git pull --rebase && git push
