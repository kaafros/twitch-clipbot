name: transcribe
on:
  workflow_dispatch:
    inputs:
      file: {description: "Audio file in repo", required: true}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install faster-whisper
      - run: python tools/transcribe.py "${{ inputs.file }}"
