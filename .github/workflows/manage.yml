name: manage
on:
  workflow_dispatch:
    inputs:
      args: {description: "stats  or  delete VIDEO_ID ...", default: "stats"}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests pyyaml google-api-python-client google-auth numpy "opencv-python-headless<5" faster-whisper
      - run: python tools/manage.py ${{ inputs.args }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
