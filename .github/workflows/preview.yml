name: preview
on:
  workflow_dispatch:
    inputs:
      stage: {description: "frames or render", default: "frames"}
      from_run: {description: "run id with frames artifact (for render)", default: ""}
permissions:
  contents: read
  actions: read
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-small-en}
      - run: pip install -r requirements.txt
      - if: inputs.stage == 'render'
        uses: actions/download-artifact@v4
        with: {name: frames, path: preview, run-id: "${{ inputs.from_run }}", github-token: "${{ secrets.GITHUB_TOKEN }}"}
      - run: python tools/preview.py ${{ inputs.stage }} preview.yaml
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v4
        with: {name: "${{ inputs.stage }}", path: preview/, retention-days: 3}
