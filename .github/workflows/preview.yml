name: preview
on:
  workflow_dispatch:
    inputs:
      stage: {description: "frames or render", default: "frames"}
      from_run: {description: "run id with frames artifact (for render)", default: ""}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-montserrat
      - uses: actions/cache@v4
        with: {path: ~/.cache/huggingface, key: whisper-small-en}
      - run: pip install -r requirements.txt
      - if: inputs.stage == 'render'
        run: git fetch origin preview-data && git checkout origin/preview-data -- preview
      - if: inputs.stage == 'batch'
        run: python tools/render_batch.py ${{ inputs.from_run }}
      - if: inputs.stage != 'batch'
        run: python tools/preview.py ${{ inputs.stage }} preview.yaml
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
      - name: Save to preview-data branch
        run: |
          git config user.name clipbot; git config user.email clipbot@users.noreply.github.com
          git checkout --orphan tmp && git rm -rqf --cached . && git add -f preview && git commit -qm "preview ${{ inputs.stage }}"
          git push -f origin tmp:preview-data
